[project]
name = "ai-ttrpg-backend"
version = "0.1.0"
description = "Persistent AI TTRPG engine — backend (engine owns truth; models propose)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pgvector>=0.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "asgi-lifespan>=2.1",
    "ruff>=0.6",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "unit: deterministic, no database, no model provider",
    "integration: uses the real ttrpg_test PostgreSQL database",
    "invariants: architectural invariant suite (release-blocking)",
    "leakage: knowledge-leakage suite (release-blocking)",
    "rules: rules-engine and ruleset fixtures",
    "replay: deterministic replay suite",
    "latency: budget / degradation-ladder tests with injected delays",
    "stress: long-run synthetic campaign (slow)",
    "eval: real-model evaluation (opt-in, needs A9_TOKEN)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
