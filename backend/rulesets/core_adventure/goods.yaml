# Prices in coin (DECISIONS 10d, Phase 3). What a seller asks the party: the list price,
# adjusted by that seller's recorded price for the party (set_price: haggling, favour, anger).
# Selling to a merchant fetches half the list price. `item` makes the bought thing a ruleset
# item (with its mechanics); goods without one become plain items with the goods' name.
goods:
  - { key: goods.meal, name: Hot meal, price: 1, tags: [food] }
  - { key: goods.ale, name: Mug of ale, price: 1, tags: [food, drink] }
  - { key: goods.room, name: Night's lodging, price: 3, unit: night, tags: [service] }
  - { key: goods.bath, name: Hot bath, price: 1, tags: [service] }
  - { key: goods.rations, name: Trail rations, price: 2, unit: day, item: item.travel_supplies, tags: [food] }
  - { key: goods.rope, name: Rope, price: 2, tags: [gear] }
  - { key: goods.torch, name: Torch, price: 1, tags: [gear, light_source] }
  - { key: goods.lantern, name: Oil lantern, price: 5, item: item.oil_lantern, tags: [gear] }
  - { key: goods.lamp_oil, name: Flask of lamp oil, price: 1, tags: [gear] }
  - { key: goods.satchel, name: Satchel, price: 3, item: item.satchel, tags: [gear] }
  - { key: goods.cloak, name: Warm cloak, price: 4, tags: [clothing] }
  - { key: goods.boots, name: Sturdy boots, price: 5, tags: [clothing] }
  - { key: goods.knife, name: Knife, price: 3, item: item.knife, tags: [weapon] }
