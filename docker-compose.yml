services:
  db:
    image: pgvector/pgvector:pg17
    container_name: ai-ttrpg-db
    environment:
      POSTGRES_USER: ttrpg
      POSTGRES_PASSWORD: ttrpg
      POSTGRES_DB: ttrpg
    ports:
      - "5434:5432"   # 5432/5433 are used by other local projects
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttrpg -d ttrpg"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
